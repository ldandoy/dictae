[package]
name = "dictae"
version = "0.2.1"
description = "Dictée vocale système pour Windows"
authors = ["Overconsulting"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "dictae_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# Audio
cpal = "0.18"
hound = "3.5"

# Réseau (ASR)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Collage
arboard = "3"
enigo = "0.6"

# Base locale
rusqlite = { version = "0.40", features = ["bundled"] }

# Contexte de saisie et vérification du collage (UI Automation)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

# Backend Vulkan (GPU) : nécessite le SDK Vulkan (VULKAN_SDK) à la compilation ;
# à l'exécution, whisper.cpp retombe sur le CPU si aucun GPU Vulkan n'est disponible.
# `cargo build --no-default-features` donne un binaire CPU seul.
[features]
default = ["gpu-vulkan"]
gpu-vulkan = ["whisper-rs/vulkan"]

[dependencies.whisper-rs]
version = "0.16"
features = ["log_backend"]

[dependencies.futures-util]
version = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

# whisper.cpp est inutilisable non optimisé : le compiler en Release même en profil dev.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.whisper-rs]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
