# Vérification continue : frontend (tsc + Vite) et tests Rust, sans bundle.

name: CI

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/ci.yml"]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Vérifier LLVM
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }

      - name: Cache du SDK Vulkan
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\1.4.363.0
          key: vulkan-sdk-1.4.363.0-windows

      - name: SDK Vulkan
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkansdk-windows-X64-1.4.363.0.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan-sdk.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait -NoNewWindow
          Get-Item "C:\VulkanSDK\1.4.363.0\Lib\vulkan-1.lib","C:\VulkanSDK\1.4.363.0\Bin\glslc.exe" | Select-Object FullName

      - name: Variables Vulkan
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.363.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\1.4.363.0\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Frontend
        run: |
          npm ci
          npm run build

      # Le build script de Tauri refuse un glob de ressources vide : il faut les
      # binaires llama.cpp (comme avant chaque `tauri dev` / `tauri build`).
      - name: Ressources llama.cpp
        run: node scripts/fetch-llama.mjs

      - name: Tests Rust
        working-directory: app/src-tauri
        run: cargo test --lib
