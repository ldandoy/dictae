# Construit l'installateur Windows et publie une Release GitHub (avec latest.json pour
# les mises à jour automatiques) à chaque tag de version, par exemple `v0.1.0`.
#
# Secret requis dans le dépôt :
#   TAURI_SIGNING_PRIVATE_KEY   contenu du fichier ~/.tauri/dictae.key (clé sans mot de passe)

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # libclang (bindgen pour whisper.cpp). LLVM est préinstallé sur windows-latest ;
      # on s'assure du chemin attendu par app/src-tauri/.cargo/config.toml.
      - name: Vérifier LLVM
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          Get-Item "C:\Program Files\LLVM\bin\libclang.dll" | Select-Object FullName

      # Backend Vulkan de whisper.cpp : le SDK fournit en-têtes, lib et compilateur de shaders.
      # Installateur officiel LunarG en mode silencieux, même version que le poste de dev.
      - name: Cache du SDK Vulkan
        id: vulkan-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\1.4.363.0
          key: vulkan-sdk-1.4.363.0-windows

      - name: SDK Vulkan
        if: steps.vulkan-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/1.4.363.0/windows/vulkansdk-windows-X64-1.4.363.0.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan-sdk.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait -NoNewWindow
          Get-Item "C:\VulkanSDK\1.4.363.0\Lib\vulkan-1.lib","C:\VulkanSDK\1.4.363.0\Bin\glslc.exe" | Select-Object FullName

      - name: Variables Vulkan
        shell: pwsh
        run: |
          "VULKAN_SDK=C:\VulkanSDK\1.4.363.0" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\1.4.363.0\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Dépendances npm
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # La clé n'a pas de mot de passe : ne pas définir TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # (une valeur, même un espace, ferait échouer le déchiffrement de la clé).
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: "Dictae ${{ github.ref_name }}"
          releaseBody: "Installateur Windows (NSIS) et mise à jour automatique. Voir les notes ci-dessous."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis
